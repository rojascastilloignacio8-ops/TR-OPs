<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./public/css/style.css">
    <title>Gestión de personas</title>
</head>
<body>
    <h1>Agregar nueva persona</h1>
    <form id="formulario">
        <label for="nombre">Nombre</label></br>
        <input type="text" id="nombre" placeholder="Escribe un nombre cualquiera"></br>
        <span id="error-nombre" class="error"></span><br>
        <label for="edad">Edad</label></br>
        <input type="number" id="edad" placeholder="Ingrese una edad entre 1 y 99" min="1" max="99"></br>

        <input type="submit" value="Agregar persona" id="env" disabled>
    </form>
    <div id="cav">

    </div>

    <script src="./public/js/main.js"></script>
</body>
</html>
